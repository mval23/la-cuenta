# Ensayo de restauración del respaldo diario.
#
# Un respaldo solo sirve si se puede restaurar. Una vez al mes toma el último
# respaldo guardado por "Respaldo diario" y lo restaura con scripts/restaurar.sh
# en un Supabase nuevo, como se haría en una emergencia. Revisa que cada tabla
# quede fila por fila igual al respaldo, que los saldos coincidan y que la app
# pueda seguir anotando. Después lo restaura otra vez encima (--reemplazar),
# como si se dañaran los datos en el mismo proyecto. Si algo falla, GitHub
# avisa por correo.
#
# Todo pasa dentro de la máquina de GitHub y se borra al terminar. Los
# registros solo muestran conteos, nunca nombres ni valores.

name: Ensayo de restauración

on:
  schedule:
    # Día 1 de cada mes, 4:00 a. m. en Colombia (9:00 UTC).
    - cron: '0 9 1 * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ensayo-restauracion.yml
      - scripts/restaurar.sh
      - scripts/verificar-restauracion.sh
      - supabase/migrations/**

permissions:
  contents: read
  # Para bajar el respaldo guardado por otro workflow.
  actions: read

env:
  DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  ensayo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Bajar el último respaldo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow respaldo.yml --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$id" ]; then
            echo "::error::No hay ningún respaldo guardado."
            exit 1
          fi
          gh run download "$id" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/respaldo"
          dump=$(find "$RUNNER_TEMP/respaldo" -name la-cuenta.dump | head -1)
          carpeta=$(dirname "$dump")
          echo "Respaldo: $(basename "$carpeta"), de la ejecución $id"
          echo "RESPALDO=$carpeta" >> "$GITHUB_ENV"

      - name: Instalar pg_restore 17, la versión de la base
        run: |
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Supabase nuevo con el esquema de las migraciones (como db push)
        # Solo la base y la autenticación: lo demás de Supabase no hace falta aquí.
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Restaurar en el proyecto nuevo
        run: bash scripts/restaurar.sh "$DB" "$RESPALDO"

      - name: Verificar
        run: bash scripts/verificar-restauracion.sh "$DB" "$RESPALDO"

      - name: Restaurar otra vez encima, como en el mismo proyecto
        run: bash scripts/restaurar.sh "$DB" "$RESPALDO" --reemplazar

      - name: Verificar otra vez
        run: bash scripts/verificar-restauracion.sh "$DB" "$RESPALDO"
